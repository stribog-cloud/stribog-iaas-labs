#cloud-config
users:
  - name: stribog
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    content: |
      <h1>Hello from Stribog episode 01</h1>

runcmd:
  - systemctl enable --now nginx
